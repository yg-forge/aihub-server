name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'aihub-web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'aihub-web/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aihub-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aihub-web/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

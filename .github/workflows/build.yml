name: AIHub CI

on:
  push:
    branches: ["main", "ci-smoke-test"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build and Smoke Test - Java 21
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aihub
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build AIHub
        run: mvn -B -ntp clean package -DskipTests

      - name: Start mock OpenAI provider
        run: |
          nohup python3 .github/scripts/mock_openai.py > mock-openai.log 2>&1 &
          echo $! > mock-openai.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Mock OpenAI provider failed to start"
          cat mock-openai.log || true
          exit 1

      - name: Start AIHub
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/aihub
          SPRING_DATASOURCE_USERNAME: aihub
          SPRING_DATASOURCE_PASSWORD: aihub
          OPENAI_BASE_URL: http://127.0.0.1:18080/v1
          OPENAI_API_KEY: ci-smoke-test-key
          JWT_SECRET: ci-smoke-test-jwt-secret-256-bit-minimum-length-value
        run: |
          nohup java -jar aihub-bootstrap/target/aihub-bootstrap-0.1.0-SNAPSHOT.jar > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to become ready"
          cat server.log || true
          exit 1

      - name: Smoke test auth and chat
        run: |
          set -e
          curl -fsS -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-user","password":"CiTestPassword123!"}'
          echo
          login="$(curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-user","password":"CiTestPassword123!"}')"
          echo "$login" | sed 's/"accessToken":"[^"]*"/"accessToken":"***"/'
          token="$(printf '%s' "$login" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["accessToken"])')"
          response="$(curl -fsS -X POST http://localhost:8080/api/v1/ai/chat \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $token" \
            -d '{"model":"gpt-ci-smoke","messages":[{"role":"user","content":"hello"}]}')"
          echo "$response"
          printf '%s' "$response" | grep -q 'CI chat smoke test passed'

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aihub-server-log
          path: |
            server.log
            mock-openai.log
          if-no-files-found: ignore

      - name: Upload JAR artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aihub-server-jars
          path: "**/target/*.jar"
          if-no-files-found: warn

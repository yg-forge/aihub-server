services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aihub}
      POSTGRES_USER: ${POSTGRES_USER:-aihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihub}
    ports:
      - "5432:5432"
    volumes:
      - aihub-postgres:/var/lib/postgresql/data
volumes:
  aihub-postgres:

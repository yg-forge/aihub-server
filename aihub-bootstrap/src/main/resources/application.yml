spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aihub}}
    username: ${POSTGRES_USER:aihub}
    password: ${POSTGRES_PASSWORD:aihub}
    hikari:
      data-source-properties:
        sslmode: require
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
aihub:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
  providers:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}

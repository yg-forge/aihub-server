spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aihub}}
    username: ${POSTGRES_USER:aihub}
    password: ${POSTGRES_PASSWORD:aihub}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
aihub:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
  providers:
    openai:
      base-url: ${AI_PROVIDER_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
      api-key: ${AI_PROVIDER_API_KEY:${OPENAI_API_KEY:}}
    model: ${AI_PROVIDER_MODEL:gpt-4o-mini}
